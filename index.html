<style>
  :root{

  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;
    min-height:100dvh;
    background:var(--bg);color:var(--teks);
    font-family:'Space Grotesk',sans-serif;

    overflow-x:hidden;
    display:flex;flex-direction:column;
  }
  a{color:inherit;text-decoration:none;touch-action:manipulation}

  /* ---- latar ---- */
  .grid-bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:52px 52px;
    mask-image:radial-gradient(ellipse 90% 75% at 50% 45%,#000 30%,transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse 90% 75% at 50% 45%,#000 30%,transparent 100%);

  .amb{position:fixed;z-index:0;pointer-events:none;border-radius:50%}
  .amb.kiri{width:80vw;height:80vw;left:-30vw;top:18%;
    background:radial-gradient(circle,rgba(255,196,0,.07),transparent 65%)}
  .amb.kanan{width:80vw;height:80vw;right:-30vw;top:18%;
    background:radial-gradient(circle,rgba(46,155,255,.08),transparent 65%)}

  /* ---- panggung ---- */
  .panggung{
    position:relative;z-index:1;flex:1;
    width:100%;max-width:880px;margin:0 auto;
    padding:clamp(16px,3vh,36px) 20px calc(8px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;justify-content:center;
    gap:clamp(16px,3.2vh,30px);
  }

  /* ---- judul ---- */
  header{text-align:center}
  h1{
    font-family:'Unbounded',sans-serif;font-weight:900;
    font-size:clamp(24px,7.5vw,52px);letter-spacing:.01em;line-height:1.12;
    text-shadow:0 0 28px rgba(240,243,247,.22),0 0 90px rgba(240,243,247,.1);
  }
  h1 .kursor{color:var(--redup);font-weight:500;animation:kedip 1.1s steps(1) infinite}

  .mikro{
    display:flex;align-items:center;gap:14px;
    font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:.34em;text-transform:uppercase;color:var(--redup);
  }
  .mikro::before,.mikro::after{content:'';flex:1;height:1px;background:var(--garis)}

  /* ---- panel broker ---- */
  .panel-grid{display:grid;grid-template-columns:1fr;gap:14px}

  .panel{
    position:relative;display:flex;flex-direction:column;
    min-height:clamp(140px,21vh,290px);
    background:var(--panel);
    border:1px solid var(--brand-line);
    padding:clamp(16px,4vw,26px);
    overflow:hidden;
    transition:transform .25s ease,box-shadow .35s ease,border-color .35s ease;
    will-change:transform;
  }
  .panel.kuning{--brand:#FFC400;--brand-line:rgba(255,196,0,.42);--brand-soft:rgba(255,196,0,.10)}
  .panel.biru  {--brand:#2E9BFF;--brand-line:rgba(46,155,255,.45);--brand-soft:rgba(46,155,255,.10)}

  .panel.kuning{box-shadow:0 0 46px -20px rgba(255,196,0,.55),inset 0 0 34px -22px rgba(255,196,0,.4)}
  .panel.biru  {box-shadow:0 0 46px -20px rgba(46,155,255,.6),inset 0 0 34px -22px rgba(46,155,255,.4)}
  @media (hover:hover){
    .panel.kuning:hover{box-shadow:0 0 80px -14px rgba(255,196,0,.85),inset 0 0 44px -18px rgba(255,196,0,.5);border-color:rgba(255,196,0,.85)}
    .panel.biru:hover  {box-shadow:0 0 80px -14px rgba(46,155,255,.9),inset 0 0 44px -18px rgba(46,155,255,.5);border-color:rgba(46,155,255,.9)}

    .panel.biru:hover  .nama{color:var(--brand);text-shadow:0 0 26px rgba(46,155,255,.8)}
    .panel:hover .panah{border-color:var(--brand);color:var(--brand);transform:translate(3px,-3px)}

  .tombol{

/* ---------- sparkline hidup di tiap panel ---------- */
function buatSpark(cv, warna) {
  const ctx = cv.getContext('2d');
  const N = 46;
  let w = 0, h = 0, data = [], off = 0, last = 0;

  const langkahBaru = v => {
    let n = v + (Math.random() - .5) * .26;
    return Math.min(.9, Math.max(.1, n));
  };
  for (let i = 0; i < N; i++) data.push(langkahBaru(.5));

  function ukur() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  ukur();
  addEventListener('resize', ukur);
  addEventListener('orientationchange', () => setTimeout(ukur, 200));

  function frame(t) {
    const dt = Math.min(50, t - last); last = t;
    if (w > 0) {
      const step = w / (N - 3);
      off += dt * .014;
      while (off >= step) {
        off -= step;
        data.push(langkahBaru(data[data.length - 1]));
        data.shift();
      }
      ctx.clearRect(0, 0, w, h);

      let mn = Math.min(...data), mx = Math.max(...data), rg = (mx - mn) || 1;
      const X = i => i * step - off;
      const Y = v => h - 5 - ((v - mn) / rg) * (h - 12);

      ctx.beginPath();
      ctx.moveTo(X(0), Y(data[0]));
      for (let i = 1; i < N; i++) ctx.lineTo(X(i), Y(data[i]));
      ctx.lineTo(X(N - 1), h); ctx.lineTo(X(0), h); ctx.closePath();
      ctx.globalAlpha = .09; ctx.fillStyle = warna; ctx.fill();
      ctx.globalAlpha = 1;

      ctx.beginPath();
      ctx.moveTo(X(0), Y(data[0]));
      for (let i = 1; i < N; i++) ctx.lineTo(X(i), Y(data[i]));
      ctx.strokeStyle = warna; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.stroke();

      ctx.beginPath();
      ctx.arc(X(N - 1), Y(data[N - 1]), 2.6, 0, Math.PI * 2);
      ctx.shadowBlur = 9; ctx.shadowColor = warna;
      ctx.fillStyle = warna; ctx.fill();
      ctx.shadowBlur = 0;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
